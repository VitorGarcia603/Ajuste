<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Novo Produto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-4">
<h2>Novo Produto</h2><form method="POST">
<div class="row mb-3"><div class="col-md-6"><input class="form-control" name="nome" placeholder="Nome" required></div><div class="col-md-6"><input class="form-control" name="categoria" placeholder="Categoria"></div></div>
<div class="row mb-3"><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="preco_custo" placeholder="Preço de Custo" required></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="preco_venda_sugerido" placeholder="Preço de Venda Sugerido"></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="peso" placeholder="Peso (kg)"></div></div>
<div class="row mb-3"><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="largura" placeholder="Largura (cm)"></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="altura" placeholder="Altura (cm)"></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="profundidade" placeholder="Profundidade (cm)"></div></div>
<button class="btn btn-success">Salvar</button></form></div></body></html>
