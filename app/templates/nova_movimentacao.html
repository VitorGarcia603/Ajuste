<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Nova Movimentação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-5">
<h2>Nova Movimentação: {{ produto.nome }}</h2><form method="POST"><div class="mb-3"><label class="form-label">Tipo:</label><select name="tipo" class="form-select"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div><div class="mb-3"><label class="form-label">Quantidade:</label><input type="number" name="quantidade" class="form-control" required></div><div class="mb-3"><label class="form-label">Descrição:</label><textarea name="descricao" class="form-control" rows="2"></textarea></div><button class="btn btn-success">Registrar</button><a href="{{ url_for('produto_detalhes', id=produto.id) }}" class="btn btn-secondary ms-2">Cancelar</a></form></div></body></html>
