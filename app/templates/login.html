<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-5">
<div class="row justify-content-center"><div class="col-md-4">
<h3 class="text-center">Login</h3><form method="POST">
<div class="mb-3"><input type="email" name="email" class="form-control" placeholder="E-mail" required></div>
<div class="mb-3"><input type="password" name="senha" class="form-control" placeholder="Senha" required></div>
<button class="btn btn-primary w-100">Entrar</button></form>
{% if error %}<div class="alert alert-danger mt-2">{{ error }}</div>{% endif %}
</div></div></div></body></html>
