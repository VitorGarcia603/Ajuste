<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Editar Produto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-5">
<h2>Editar Produto: {{ produto.nome }}</h2><form method="POST"><div class="row mb-3"><div class="col-md-6"><input class="form-control" name="nome" value="{{ produto.nome }}" required></div><div class="col-md-6"><input class="form-control" name="categoria" value="{{ produto.categoria }}"></div></div><div class="row mb-3"><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="preco_custo" value="{{ produto.preco_custo }}" required></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="preco_venda_sugerido" value="{{ produto.preco_venda_sugerido }}"></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="peso" value="{{ produto.peso }}"></div></div><div class="row mb-3"><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="largura" value="{{ produto.largura }}"></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="altura" value="{{ produto.altura }}"></div><div class="col-md-4"><input type="number" step="0.01" class="form-control" name="profundidade" value="{{ produto.profundidade }}"></div></div><button class="btn btn-primary">Salvar alterações</button><a href="{{ url_for('produto_detalhes', id=produto.id) }}" class="btn btn-secondary ms-2">Cancelar</a></form></div></body></html>
