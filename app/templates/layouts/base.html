<!doctype html>
<html lang="pt-br" data-bs-theme="{{ g.theme or 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}App Ajuste{% endblock %}</title>

  <!-- CSS compilado -->
  <link href="{{ url_for('static', filename='css/app.css', v=version_hash) }}" rel="stylesheet">
  <!-- Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body class="d-flex">
  {% include "partials/sidebar.html" %}

  <div class="flex-grow-1 min-vh-100 d-flex flex-column">
      {% include "partials/topbar.html" %}
      <main class="container-fluid py-4 flex-grow-1">
          {% block content %}{% endblock %}
      </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/theme.js', v=version_hash) }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
