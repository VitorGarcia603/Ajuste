<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Detalhes do Produto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-5">
<h1>Produto: {{ produto.nome }}</h1><p><strong>Categoria:</strong> {{ produto.categoria }}</p><p><strong>Estoque:</strong> {{ produto.estoque }}</p>
<a href="/produto/{{ produto.id }}/movimentar" class="btn btn-primary">Nova Movimentação</a>
<table class="table table-striped mt-3"><thead><tr><th>Tipo</th><th>Qnt</th><th>Desc</th><th>Data</th><th>Ações</th></tr></thead><tbody>
{% for mov in produto.movimentacoes %}<tr><td>{{ mov.tipo }}</td><td>{{ mov.quantidade }}</td><td>{{ mov.descricao }}</td><td>{{ mov.data.strftime('%d/%m/%Y %H:%M') }}</td><td><a href="/movimentacao/{{ mov.id }}/editar" class="btn btn-sm btn-warning">Editar</a><form action="/movimentacao/{{ mov.id }}/excluir" method="post" style="display:inline;"><button class="btn btn-sm btn-danger">Excluir</button></form></td></tr>{% endfor %}</tbody></table>
<a href="/produtos" class="btn btn-secondary">Voltar</a></div></body></html>
