<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Editar Movimentação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-5">
<h2>Editar Movimentação: {{ movimentacao.produto.nome }}</h2><form method="POST"><div class="mb-3"><label class="form-label">Tipo:</label><select name="tipo" class="form-select"><option value="entrada" {% if movimentacao.tipo=='entrada' %}selected{% endif %}>Entrada</option><option value="saida" {% if movimentacao.tipo=='saida' %}selected{% endif %}>Saída</option></select></div><div class="mb-3"><label class="form-label">Quantidade:</label><input type="number" name="quantidade" class="form-control" value="{{ movimentacao.quantidade }}" required></div><div class="mb-3"><label class="form-label">Descrição:</label><textarea name="descricao" class="form-control" rows="2">{{ movimentacao.descricao }}</textarea></div><button class="btn btn-primary">Salvar alterações</button><a href="{{ url_for('produto_detalhes', id=movimentacao.produto.id) }}" class="btn btn-secondary ms-2">Cancelar</a></form></div></body></html>
