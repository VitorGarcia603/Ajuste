<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Movimentar Produto</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h2>Movimentar Produto: {{ produto.nome }}</h2>
        <form method="POST">
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo de Movimentação:</label>
                <select name="tipo" class="form-select" id="tipo">
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="quantidade" class="form-label">Quantidade:</label>
                <input type="number" name="quantidade" class="form-control" id="quantidade" required>
            </div>
            <button class="btn btn-primary">Registrar Movimentação</button>
        </form>
        <a href="/produtos" class="btn btn-secondary mt-3">⬅ Voltar</a>
    </div>
</body>
</html>
