<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Produtos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light"><div class="container mt-4">
<h1>Lista de Produtos</h1><a href="/produto/novo" class="btn btn-primary mb-3">➕ Novo Produto</a>
<table class="table table-bordered"><thead class="table-dark"><tr><th>Nome</th><th>Estoque</th><th>Ações</th></tr></thead><tbody>
{% for p in produtos %}<tr><td>{{ p.nome }}</td><td>{{ p.estoque }}</td>
<td><a href="/produto/{{ p.id }}" class="btn btn-sm btn-info">Detalhes</a>
<a href="/produto/{{ p.id }}/editar" class="btn btn-sm btn-warning">Editar</a></td></tr>{% endfor %}</tbody></table>
</div></body></html>
